services:
  quiz:
    build: .
    container_name: quiz-party
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Moderator-PIN; leer = zufällige 6-stellige PIN in data/host-pin, steht im Log (docker compose logs quiz)
      HOST_PIN: ${HOST_PIN:-}
      # Öffentliche Adresse für QR-Code, Anmelde-Links und Google/Facebook (ohne Schrägstrich am Ende).
      # Leer lassen = wird aus der aufgerufenen Adresse abgeleitet.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Anmeldung für die Online-Modi (optional, siehe README); leer = ausgeschaltet
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_LOG: ${MAIL_LOG:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # Fragen-Pool (quizzes/), Party-Spielstand (state.json), Konten und Ergebnisse (quiz.db)
      - ./data:/app/data
