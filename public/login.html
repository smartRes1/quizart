<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15121c">
<title>Anmelden – Quiz-Party</title>
<link rel="stylesheet" href="/common.css">
<style>
  .or { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 22px 0 8px; font-size: 14px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .provider { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .provider svg { width: 22px; height: 22px; flex: none; }
</style>
</head>
<body>
<div class="stripe"></div>
<header><a class="home" href="/">← Quiz-Party</a></header>
<main id="app"><p class="muted">Lade …</p></main>

<script src="/common.js"></script>
<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const next = safePath(params.get('next'));
  const token = params.get('token');
  const device = params.get('geraet');

  // Link aus der E-Mail bzw. QR-Code vom anderen Gerät: erst bestätigen, dann anmelden
  // (Mail-Vorschauen und Scanner-Apps öffnen den Link nur, sie klicken nicht)
  function renderConfirm() {
    app.innerHTML = `
      <div class="kicker">Anmelden</div>
      <h1>Fast geschafft</h1>
      <p class="muted">Tippe auf den Knopf, um dich ${device ? 'mit deinem Konto ' : ''}auf diesem Gerät anzumelden.</p>
      <button class="primary" id="go">Jetzt anmelden</button>
      <div class="error" id="err"></div>`;
    document.getElementById('go').addEventListener('click', async (e) => {
      e.target.disabled = true;
      const r = device ? await api('/auth/device', { token: device }) : await api('/auth/email/verify', { token });
      if (r.ok) { location.replace(r.data.next); return; }
      history.replaceState(null, '', '/login');
      render(r.data.error);
    });
  }

  async function render(error) {
    const me = await account();
    if (me.user && !error) {
      app.innerHTML = `
        <div class="kicker">Anmelden</div>
        <h1>Du bist angemeldet</h1>
        <p>als <b>${esc(me.user.name)}</b>.</p>
        <a class="primary" href="${esc(next)}">Weiter</a>
        <a class="secondary" href="/konto">Mein Konto</a>`;
      return;
    }
    const p = me.providers;
    const q = encodeURIComponent(next);
    app.innerHTML = `
      <div class="kicker">Anmelden</div>
      <h1>Mitspielen mit Namen</h1>
      <p class="muted">Mit Namen kommst du in die Bestenliste und kannst Duelle spielen. Ein Passwort brauchst du nicht.</p>
      ${error ? `<p class="error">${esc(error)}</p>` : ''}
      <form id="nameForm" autocomplete="off">
        <input type="text" id="name" maxlength="24" placeholder="Dein Spielername" required>
        <button class="primary" id="create">Los geht's</button>
        <div class="error" id="nameErr"></div>
      </form>
      <p class="muted" style="font-size:14px">Dein Konto hängt an diesem Gerät. Auf einem weiteren Handy meldest du dich unter „Mein Konto“ per QR-Code an.</p>
      ${p.google || p.facebook ? '<div class="or">oder</div>' : ''}
      ${p.google ? `<a class="secondary provider" href="/auth/google?next=${q}"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8l3.6-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7.1l3.6 2.8C6.6 7.4 9.1 5.4 12 5.4z"/></svg>Weiter mit Google</a>` : ''}
      ${p.facebook ? `<a class="secondary provider" href="/auth/facebook?next=${q}"><svg viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>Weiter mit Facebook</a>` : ''}
      ${p.email ? `<div class="or">oder per E-Mail</div>
      <form id="mailForm">
        <input type="email" id="email" placeholder="deine@email.at" autocomplete="email" required>
        <button class="secondary" id="send">Anmelde-Link schicken</button>
        <div class="error" id="err"></div>
      </form>` : ''}
      <p class="links"><a href="/datenschutz">Datenschutz</a><a href="/impressum">Impressum</a></p>`;
    document.getElementById('nameForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('create');
      btn.disabled = true;
      const r = await api('/auth/name', { name: document.getElementById('name').value, next });
      if (r.ok) { location.replace(r.data.next); return; }
      btn.disabled = false;
      document.getElementById('nameErr').textContent = r.data.error || 'Das hat nicht geklappt.';
    });
    if (!p.email) return;
    document.getElementById('mailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('send');
      btn.disabled = true;
      const r = await api('/auth/email', { email: document.getElementById('email').value, next });
      if (r.ok) {
        app.innerHTML = `
          <div class="kicker">Anmelden</div>
          <h1>Schau in dein Postfach</h1>
          <p>${esc(r.data.message)}</p>
          <p class="muted">Öffne den Link am besten auf diesem Gerät. Nichts angekommen? Schau auch im Spam-Ordner nach.</p>
          <a class="secondary" href="${esc(location.pathname + location.search)}">Andere Adresse</a>`;
      } else {
        btn.disabled = false;
        document.getElementById('err').textContent = r.data.error || 'Das hat nicht geklappt.';
      }
    });
  }

  if (token || device) renderConfirm();
  else render(params.get('fehler'));
})();
</script>
</body>
</html>
